<div class="flex flex-col items-center justify-center py-16 px-4 text-center">
  <div class="relative mb-6">
    <div class="absolute inset-0 bg-amber-500/20 blur-3xl rounded-full"></div>
    <div class="relative w-20 h-20 border-2 border-amber-500/50 rounded-2xl flex items-center justify-center rotate-45 backdrop-blur-sm">
      <span class="text-4xl -rotate-45">⚠️</span>
    </div>
  </div>

  <h2 class="text-2xl font-black text-white mb-2 tracking-tight uppercase">
    ERROR
  </h2>

  <p class="text-slate-400 text-sm max-w-xs mx-auto mb-8 font-medium">
    PAGE NOT FOUND
  </p>

  @if (showButton()) {
    <a routerLink="/characters"
       class="px-6 py-2.5 bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs font-bold uppercase rounded-xl border border-slate-700 transition-all active:scale-95">
      Volver al Inicio
    </a>
  }
</div>
