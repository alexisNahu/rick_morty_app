<div class="min-h-screen flex flex-col items-center justify-center bg-slate-950 px-4 relative overflow-hidden">

  <!-- Blobs de fondo -->
  <div class="absolute w-96 h-96 bg-red-500/10 rounded-full blur-[120px] -top-20 -left-20"></div>
  <div class="absolute w-96 h-96 bg-amber-500/10 rounded-full blur-[120px] -bottom-20 -right-20"></div>

  <!-- Icono -->
  <div class="relative mb-8">
    <div class="absolute inset-0 bg-amber-500/20 blur-3xl rounded-full scale-150"></div>
    <div class="relative w-24 h-24 border-2 border-amber-500/50 rounded-2xl flex items-center justify-center rotate-45 backdrop-blur-sm bg-slate-900/80">
      <span class="text-5xl -rotate-45">⚠️</span>
    </div>
  </div>

  <!-- Código de error -->
  <p class="text-amber-500/60 text-xs font-bold uppercase tracking-[0.4em] mb-2">
    Galactic Federation — Error
  </p>

  <!-- Número 404 -->
  <h1 class="text-[8rem] font-black text-white/5 leading-none select-none absolute">
    404
  </h1>

  <h2 class="text-3xl font-black text-white mb-3 tracking-tighter uppercase italic relative">
    Dimension Not <span class="text-amber-400">Found</span>
  </h2>

  <p class="text-slate-500 text-sm max-w-xs mx-auto mb-10 font-medium tracking-wide relative">
    The portal you're looking for doesn't exist in this dimension.
  </p>

  @if (showButton()) {
    <a routerLink="/characters"
       class="relative px-8 py-3 bg-lime-400 hover:bg-lime-300 text-slate-950 text-xs font-black uppercase rounded-xl tracking-widest transition-all active:scale-95 shadow-lg shadow-lime-500/20">
      Back to Citadel
    </a>
  }

</div>
