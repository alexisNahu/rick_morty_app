<div class="min-h-screen flex items-center justify-center bg-slate-950 px-4 relative overflow-hidden">
  <div class="absolute w-96 h-96 bg-lime-500/20 rounded-full blur-[120px] -top-20 -left-20"></div>
  <div class="absolute w-96 h-96 bg-cyan-500/10 rounded-full blur-[120px] -bottom-20 -right-20"></div>

  <div class="max-w-md w-full bg-slate-900 border border-lime-500/30 rounded-2xl shadow-[0_0_50px_-12px_rgba(132,204,22,0.2)] p-8 z-10">
    <div class="text-center mb-8">
      <h2 class="text-3xl font-black tracking-tighter text-white uppercase italic">
        Rick <span class="text-lime-400">Portal</span> OS
      </h2>
      <p class="text-slate-400 text-xs mt-1 tracking-widest uppercase">Galactic Federation - Login</p>
    </div>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="space-y-6">

      <div>
        <label class="block text-xs font-bold text-lime-400 uppercase tracking-wider mb-1">Email</label>
        <input
          type="email"
          formControlName="email"
          class="mt-1 block w-full px-4 py-3 bg-slate-800 border border-slate-700 text-lime-100 rounded-lg focus:outline-none focus:ring-2 focus:ring-lime-500/50 focus:border-lime-500 transition-all placeholder:text-slate-600"
          placeholder="c-137@citadel.com">
        @if (loginForm.get('email')?.touched && loginForm.get('email')?.errors?.['email']) {
          <span class="text-[10px] text-red-400 mt-1 block uppercase font-bold tracking-tighter">ERROR: Invalid email format</span>
        }
      </div>

      <div>
        <label class="block text-xs font-bold text-lime-400 uppercase tracking-wider mb-1">Encryption Code</label>
        <input
          type="password"
          formControlName="password"
          class="mt-1 block w-full px-4 py-3 bg-slate-800 border border-slate-700 text-lime-100 rounded-lg focus:outline-none focus:ring-2 focus:ring-lime-500/50 focus:border-lime-500 transition-all placeholder:text-slate-600"
          placeholder="••••••••">
      </div>

      @if (message()) {
        <div class="bg-red-950/30 text-red-400 p-3 rounded-lg text-xs border border-red-500/50 animate-pulse">
          ⚠️ {{ message() }}
        </div>
      }

      <button
        type="submit"
        [disabled]="loginForm.invalid || isLoading()"
        class="w-full flex justify-center py-3 px-4 border-none rounded-lg shadow-lg text-sm font-black uppercase tracking-widest text-slate-950 bg-lime-400 hover:bg-lime-300 active:scale-[0.98] transition-all disabled:opacity-30 disabled:grayscale disabled:cursor-not-allowed shadow-lime-500/20">

        @if (isLoading()) {
          <span class="flex items-center">
            <svg class="animate-spin -ml-1 mr-3 h-5 w-5 text-slate-900" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
              <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
              <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
            </svg>
            Opening Portal...
          </span>
        } @else {
          Wubba Lubba Dub Dub!
        }
      </button>
    </form>

    <p class="mt-6 text-center text-xs text-slate-500 uppercase tracking-tighter">
      New to the Citadel? <a [routerLink]="'/auth/register'" class="text-cyan-400 hover:text-cyan-300 font-bold transition-colors">Register here</a>
    </p>
  </div>
</div>
