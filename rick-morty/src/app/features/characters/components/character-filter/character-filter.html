<div class="flex justify-end mb-4">
  <button
    (click)="isFiltersOpen.set(!isFiltersOpen())"
    class="flex items-center gap-2 px-4 py-2 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-xl border border-slate-700 transition-all active:scale-95 shadow-lg"
  >
    <span class="text-xs font-bold uppercase tracking-wider">
      {{ isFiltersOpen() ? 'Hide Filters' : 'Show Filters' }}
    </span>
    <svg
      xmlns="http://www.w3.org/2000/svg"
      class="w-4 h-4 transition-transform duration-300"
      [class.rotate-180]="isFiltersOpen()"
      fill="none" viewBox="0 0 24 24" stroke="currentColor"
    >
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
    </svg>
  </button>
</div>

<div
  class="grid transition-all duration-300 ease-in-out overflow-hidden"
  [style.grid-template-rows]="isFiltersOpen() ? '1fr' : '0fr'"
>
  <div class="min-h-0">
    <form [formGroup]="searchForm" (ngSubmit)="onSubmit()"
          class="bg-slate-900/80 p-6 rounded-2xl border border-slate-800 shadow-2xl backdrop-blur-md mb-8">

      <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5">

        <div class="flex flex-col gap-1.5">
          <label class="text-xs font-semibold text-slate-500 uppercase ml-1">Name</label>
          <input
            type="text"
            formControlName="name"
            placeholder="e.g., Rick Sanchez"
            class="bg-slate-800 border border-slate-700 text-white p-2.5 rounded-xl focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 outline-none transition-all placeholder:text-slate-600"
          >
        </div>

        <div class="flex flex-col gap-1.5">
          <label class="text-xs font-semibold text-slate-500 uppercase ml-1">Species</label>
          <select
            formControlName="species"
            class="bg-slate-800 border border-slate-700 text-white p-2.5 rounded-xl focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 outline-none cursor-pointer transition-all appearance-none"
          >
            <option value="">Any species</option>
            <option value="human">Human</option>
            <option value="alien">Alien</option>
            <option value="humanoid">Humanoid</option>
            <option value="poopybutthole">Poopybutthole</option>
            <option value="mythological creature">Mythological Creature</option>
            <option value="robot">Robot</option>
            <option value="cronenberg">Cronenberg</option>
            <option value="disease">Disease</option>
            <option value="animal">Animal</option>
            <option value="unknown">Unknown</option>
          </select>
        </div>

        <div class="flex flex-col gap-1.5">
          <label class="text-xs font-semibold text-slate-500 uppercase ml-1">Type</label>
          <select
            formControlName="type"
            class="bg-slate-800 border border-slate-700 text-white p-2.5 rounded-xl focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 outline-none cursor-pointer transition-all appearance-none"
          >
            <option value="">Any type</option>
            <option value="genetic experiment">Genetic Experiment</option>
            <option value="superhuman">Superhuman</option>
            <option value="parasite">Parasite</option>
            <option value="cyborg">Cyborg</option>
            <option value="human with antennae">Human with Antennae</option>
            <option value="robot-human hybrid">Robot-Human Hybrid</option>
            <option value="meeseeks">Meeseeks</option>
            <option value="gromflomite">Gromflomite</option>
            <option value="microverse inhabitant">Microverse Inhabitant</option>
            <option value="toy">Toy</option>
            <option value="unknown">Unknown</option>
          </select>
        </div>

        <div class="flex flex-col gap-1.5">
          <label class="text-xs font-semibold text-slate-500 uppercase ml-1">Status</label>
          <select
            formControlName="status"
            class="bg-slate-800 border border-slate-700 text-white p-2.5 rounded-xl focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 outline-none cursor-pointer transition-all"
          >
            <option value="">Any status</option>
            <option value="alive">Alive</option>
            <option value="dead">Dead</option>
            <option value="unknown">Unknown</option>
          </select>
        </div>

        <div class="flex flex-col gap-1.5">
          <label class="text-xs font-semibold text-slate-500 uppercase ml-1">Gender</label>
          <select
            formControlName="gender"
            class="bg-slate-800 border border-slate-700 text-white p-2.5 rounded-xl focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 outline-none cursor-pointer transition-all"
          >
            <option value="">Any gender</option>
            <option value="male">Male</option>
            <option value="female">Female</option>
            <option value="genderless">Genderless</option>
            <option value="unknown">Unknown</option>
          </select>
        </div>

        <div class="flex items-end gap-2">
          <button
            type="submit"
            [disabled]="searchForm.invalid"
            class="flex-1 bg-indigo-600 hover:bg-indigo-500 disabled:bg-slate-700 disabled:text-slate-500 text-white font-bold py-2.5 rounded-xl transition-all active:scale-95 shadow-lg shadow-indigo-500/20"
          >
            Apply Filters
          </button>
        </div>

      </div>

      @if (searchForm.invalid && searchForm.dirty) {
        <div class="mt-4 text-xs text-red-400 bg-red-400/10 p-2 rounded-lg border border-red-400/20 text-center">
          Please ensure all fields are filled out correctly.
        </div>
      }
    </form>
  </div>
</div>
