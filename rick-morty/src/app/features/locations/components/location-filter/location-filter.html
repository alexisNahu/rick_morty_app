<div class="flex justify-end mb-4">
  <button
    (click)="isFiltersOpen.set(!isFiltersOpen())"
    class="flex items-center gap-2 px-4 py-2 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-xl border border-slate-700 transition-all active:scale-95 shadow-lg"
  >
    <span class="text-xs font-bold uppercase tracking-wider">
      {{ isFiltersOpen() ? 'Hide Filters' : 'Show Filters' }}
    </span>
    <svg
      xmlns="http://www.w3.org/2000/svg"
      class="w-4 h-4 transition-transform duration-300"
      [class.rotate-180]="isFiltersOpen()"
      fill="none" viewBox="0 0 24 24" stroke="currentColor"
    >
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
    </svg>
  </button>
</div>

<div
  class="grid transition-all duration-300 ease-in-out overflow-hidden"
  [style.grid-template-rows]="isFiltersOpen() ? '1fr' : '0fr'"
>
  <div class="min-h-0 overflow-hidden">
    <form [formGroup]="searchForm" (ngSubmit)="onSubmit()"
          class="bg-slate-900/80 p-6 rounded-2xl border border-slate-800 shadow-2xl backdrop-blur-md mb-8">

      <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5">

        <div class="flex flex-col gap-1.5">
          <label class="text-xs font-semibold text-slate-500 uppercase ml-1">Name</label>
          <input
            type="text"
            formControlName="name"
            placeholder="e.g., Earth..."
            class="bg-slate-800 border border-slate-700 text-white p-2.5 rounded-xl focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500 outline-none transition-all placeholder:text-slate-600"
          >
        </div>

        <div class="flex flex-col gap-1.5">
          <label class="text-xs font-semibold text-slate-500 uppercase ml-1">Location Type</label>
          <input
            type="text"
            formControlName="type"
            placeholder="e.g., Planet, Cluster..."
            class="bg-slate-800 border border-slate-700 text-white p-2.5 rounded-xl focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500 outline-none transition-all placeholder:text-slate-600"
          >
        </div>

        <div class="flex flex-col gap-1.5">
          <label class="text-xs font-semibold text-slate-500 uppercase ml-1">Dimension</label>
          <input
            type="text"
            formControlName="dimension"
            placeholder="e.g., C-137..."
            class="bg-slate-800 border border-slate-700 text-white p-2.5 rounded-xl focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500 outline-none transition-all placeholder:text-slate-600"
          >
        </div>

        <div class="flex items-end gap-2 lg:col-span-3 lg:justify-end mt-2">
          <button
            type="button"
            (click)="onReset()"
            class="px-5 py-2.5 text-slate-400 text-xs font-bold uppercase hover:text-white transition-colors">
            Clear
          </button>

          <button
            type="submit"
            [disabled]="searchForm.invalid"
            class="px-8 py-2.5 bg-emerald-600 hover:bg-emerald-500 disabled:bg-slate-700 disabled:text-slate-500 text-white font-bold rounded-xl transition-all active:scale-95 shadow-lg shadow-emerald-500/20">
            Filter Locations
          </button>
        </div>

      </div>

      @if (searchForm.invalid && searchForm.dirty) {
        <div class="mt-4 text-xs text-red-400 bg-red-400/10 p-2 rounded-lg border border-red-400/20 text-center">
          Please ensure all fields are filled out correctly.
        </div>
      }
    </form>
  </div>
</div>
