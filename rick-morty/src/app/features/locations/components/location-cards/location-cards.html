<div [routerLink]="['/', APP_ROUTES.LOCATIONS_DETAILS, location().id]"
     class="bg-slate-800 rounded-xl border border-slate-700 hover:border-indigo-500 transition-all duration-300 group overflow-hidden cursor-pointer flex flex-col h-full shadow-lg">

  <div class="relative h-32 bg-gradient-to-br from-slate-900 via-indigo-950 to-slate-900 flex items-center justify-center overflow-hidden">
    <div class="absolute inset-0 opacity-10 bg-[url('https://www.transparenttextures.com/patterns/stardust.png')] group-hover:scale-125 transition-transform duration-700"></div>

    <span class="text-5xl filter drop-shadow-[0_0_8px_rgba(99,102,241,0.4)] group-hover:scale-110 transition-transform duration-500">
      @let type = location().type;
      {{ type === 'Planet' ? '🪐' : type === 'Space station' ? '🛰️' : '🌌' }}
    </span>

    <div class="absolute top-2 right-2">
      <span class="px-2 py-0.5 text-[10px] font-mono font-bold text-indigo-300 bg-indigo-500/10 border border-indigo-500/30 rounded-md">
        #{{ location().id }}
      </span>
    </div>
  </div>

  <div class="p-4 flex flex-col flex-1">
    <h3 class="text-xl font-bold text-white group-hover:text-indigo-400 transition-colors truncate">
      {{ location().name }}
    </h3>

    <p class="text-indigo-400 text-sm mb-3 font-medium">
      {{ location().type }}
    </p>

    <div class="mt-auto pt-3 border-t border-slate-700/50 flex flex-col gap-2">
      <div class="flex justify-between items-center">
        <span class="text-slate-500 text-[10px] uppercase font-bold tracking-wider">Dimension</span>
        <span class="text-slate-300 text-xs truncate max-w-[140px]">{{ location().dimension }}</span>
      </div>

      <div class="flex justify-between items-center">
        <span class="text-slate-500 text-[10px] uppercase font-bold tracking-wider">Population</span>
        <span class="text-slate-300 text-xs font-mono">{{ location().residents.length }} res.</span>
      </div>
    </div>
  </div>
</div>
