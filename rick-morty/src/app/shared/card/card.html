<div [routerLink]="['/', APP_ROUTES.CHARACTER_DETAILS, character().id]"
     class="max-w-sm bg-slate-900 border border-slate-800 rounded-xl shadow-lg overflow-hidden hover:border-indigo-500 transition-all duration-300 group">

  <div class="relative overflow-hidden">
    <img class="w-full h-48 object-cover group-hover:scale-110 transition-duration-500"
         [src]="character().image"
         [alt]="character().name">

    <span class="absolute top-2 right-2 px-2 py-1 text-xs font-bold rounded-full bg-green-500/20 text-green-400 border border-green-500/50">
      {{ character().status }}
    </span>
  </div>

  <div class="p-5">
    <h5 class="mb-1 text-xl font-bold tracking-tight text-white group-hover:text-indigo-400 transition-colors">
      {{ character().name }}
    </h5>

    <div class="flex flex-col gap-2 mt-3">
      <p class="text-sm text-slate-400 flex items-center">
        <span class="font-semibold text-slate-300 mr-1">Species:</span> {{ character().species }}
      </p>

      <p class="text-sm text-slate-400">
        <span class="font-semibold text-slate-300 mr-1">Last known location:</span>
        {{ character().location.name }}
      </p>
    </div>
  </div>
</div>
